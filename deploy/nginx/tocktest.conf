# Production reverse proxy template for TockTest.
# Replace hostnames, certificate paths, and upstream addresses before use.

limit_req_zone $binary_remote_addr zone=tocktest_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=tocktest_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=tocktest_conn:10m;

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

upstream tocktest_frontend {
  server 127.0.0.1:3012;
  keepalive 32;
}

upstream tocktest_backend {
  server 127.0.0.1:4004;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name tocktest.example.com;

  ssl_certificate /etc/letsencrypt/live/tocktest.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/tocktest.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  client_max_body_size 12m;
  limit_conn tocktest_conn 50;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_connect_timeout 5s;
  proxy_send_timeout 30s;
  proxy_read_timeout 30s;

  location = /api/v1/auth/login {
    limit_req zone=tocktest_auth burst=10 nodelay;
    proxy_pass http://tocktest_backend;
  }

  location /api/v1/ {
    limit_req zone=tocktest_api burst=40 nodelay;
    proxy_pass http://tocktest_backend;
  }

  location / {
    limit_req zone=tocktest_api burst=80 nodelay;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_pass http://tocktest_frontend;
  }
}

server {
  listen 80;
  server_name tocktest.example.com;
  return 301 https://$host$request_uri;
}
